name: Build Kernel (Bazel/Kleaf)

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KernelSU variant (ALL = KWS + KSUN + VNL)'
        type: choice
        options:
          - KWS
          - KSUN
          - VNL
          - ALL
        default: KWS
      kernel_name:
        description: 'Kernel base name'
        type: string
        default: Liino-RiniX
      kernel_ref:
        description: 'kernel branch / tag / SHA to build'
        type: string
        default: android16-6.12-lts
      susfs_branch:
        description: 'SUSFS kernel patch branch (gki-android12-5.10 / gki-android16-6.12 ...)'
        type: string
        default: gki-android16-6.12
      anykernel_branch:
        description: 'AnyKernel3 installer branch (android16-6.12 = 6.12)'
        type: string
        default: android16-6.12

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ksu_variants: ${{ steps.resolve.outputs.ksu_variants }}
    steps:
      - name: Resolve variants
        id: resolve
        run: |
          if [ "${{ inputs.ksu_variant }}" = "ALL" ]; then
            echo 'ksu_variants=["KWS","KSUN","VNL"]' >> "$GITHUB_OUTPUT"
          else
            echo 'ksu_variants=["${{ inputs.ksu_variant }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.ksu }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ksu: ${{ fromJson(needs.setup.outputs.ksu_variants) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Maximize Runner Disk Space
      run: |
        echo "=== Disk Space Before Cleaning ==="
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/lib/jvm
        sudo rm -rf /opt/pipx
        sudo rm -rf "/usr/local/share/powershell"
        sudo rm -rf "/etc/skel/.dotnet"
        sudo apt-get clean
        echo "=== Disk Space After Cleaning ==="
        df -h

    - name: Install build dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends \
          bc bison flex build-essential libssl-dev libelf-dev \
          cpio kmod rsync zip patch curl ca-certificates \
          python3 python3-pip python3-lxml git wget binutils zstd \
          pahole

    - name: Install Repo Tool
      run: |
        mkdir -p ~/.bin \
        PATH="${HOME}/.bin:${PATH}"
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+rx ~/.bin/repo
        sudo ln -sf ~/.bin/repo /usr/bin/repo
  
    - name: Configure Git
      run: |
        git config --global user.name "RiniX"
        git config --global user.email "amethrin.gh@gmail.com"

    - name: Sync GKI Source
      run: |
        repo init -u https://android.googlesource.com/kernel/manifest -b common-${{ inputs.kernel_ref }} --depth=1 --groups=default,-mips,-x86,-riscv
        repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
        
    - name: Apply KernelSU
      if: matrix.ksu != 'VNL'
      working-directory: common
      run: |
        if [ "${{ matrix.ksu }}" = "KWS" ]; then
          curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/main/kernel/setup.sh" | bash -s master
          printf '\nCONFIG_KSU=y\nCONFIG_KSU_MANUAL_SU=n\nCONFIG_KSU_SUSFS=n\n' >> user_flags.fragment
        else
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          printf '\nCONFIG_KSU=y\nCONFIG_KSU_MANUAL_SU=n\nCONFIG_KSU_SUSFS=y\n' >> user_flags.fragment
        fi

    - name: Apply SUSFS patches (KSUN only)
      if: matrix.ksu == 'KSUN'
      working-directory: common
      run: |
        SUSFS_BRANCH="${{ inputs.susfs_branch }}"
        git clone https://gitlab.com/simonpunk/susfs4ksu/ -b "${SUSFS_BRANCH}" sus
        rm -rf sus/.git
        susfs=sus/kernel_patches
        cp -r "$susfs/fs" .
        cp -r "$susfs/include" .
        PATCH_FILE="$susfs/50_add_susfs_in_${SUSFS_BRANCH}.patch"
        if [ ! -f "$PATCH_FILE" ]; then
          echo "FATAL: patch $PATCH_FILE not found in susfs4ksu ${SUSFS_BRANCH}"
          exit 1
        fi
        cp "$PATCH_FILE" .
        patch -p1 < "$(basename "$PATCH_FILE")" || true

        # 6.12 API fixup: getname_flags() signature changed from 3 args to 2 args.
        # The SUSFS patch for gki-android16-6.12 still uses the old 3-argument form,
        # causing compilation errors in fs/open.c
        if [[ "${{ inputs.susfs_branch }}" == gki-android16-6.12* ]]; then
          if grep -q 'getname_flags(filename, lookup_flags, NULL)' fs/open.c; then
            sed -i 's/getname_flags(filename, lookup_flags, NULL)/getname_flags(filename, lookup_flags)/' fs/open.c
            echo "susfs: applied getname_flags() 2-arg workaround for 6.12 (dropped ', NULL')"
          elif grep -q 'getname_flags(filename, lookup_flags)' fs/open.c; then
            echo "susfs: upstream patch already uses 2-arg getname_flags() - no workaround needed"
          else
            echo "WARNING: getname_flags() call not found in expected form in fs/open.c - manual review may be needed"
          fi
        fi

        # Inject susfs include at the very first line of fs/exec.c
        if ! grep -q '#include <linux/susfs.h>' fs/exec.c; then
          echo "Fixing fs/exec.c failed hunk via top insertion..."
          sed -i '1s/^/#ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs.h>\n#endif\n/' fs/exec.c
        fi

        # Inject susfs include at the very first line of fs/proc/task_mmu.c
        if ! grep -q '#include <linux/susfs.h>' fs/proc/task_mmu.c; then
          echo "Fixing fs/proc/task_mmu.c failed hunk via top insertion..."
          sed -i '1s/^/#ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs.h>\n#endif\n/' fs/proc/task_mmu.c
        fi

        # Verification check to ensure the patches stuck
        if ! grep -q '#include <linux/susfs.h>' fs/exec.c || ! grep -q '#include <linux/susfs.h>' fs/proc/task_mmu.c; then
          echo "FATAL: Manual 6.12 kernel patch fixups failed to bind!"
          exit 1
        fi

        echo "6.12 VFS fixups successfully attached at top of files."


    - name: Set LOCALVERSION
      working-directory: common
      run: |
        # Cap LOCALVERSION so the release string (5.15.211 + localver +
        # -g<SHA>[-dirty]) stays under the kernel's 64-char utsrelease
        # limit.  Full branding lives in the zip name / kernel.string.
        KN="$(echo "${{ inputs.kernel_name }}" | cut -c1-24 | sed 's/-$//')"
        LOCALVER="-${KN}-${{ matrix.ksu }}"
        printf '\nCONFIG_LOCALVERSION="%s"\n' "$LOCALVER" >> user_flags.fragment

    - name: Define Kernel Fragment
      working-directory: common
      run: |
        cat << 'EOF' >> BUILD.bazel

        filegroup(
            name = "user_flags_target",
            srcs = ["user_flags.fragment"],
            visibility = ["//visibility:public"],
        )
        EOF

    - name: Apply Nuke Dirty String Patch
      working-directory: common
      run: |
       # Download the raw patch from the repository
       curl -LO https://raw.githubusercontent.com/ravindu644/Android-Kernel-Tutorials/refs/heads/main/patches/017.nuke_dirty_string.patch
       
       # Force apply the patch even if line spaces are slightly mismatched
       git apply --ignore-space-change --ignore-whitespace 017.nuke_dirty_string.patch

    - name: Build GKI (Bazel/Kleaf)
      run: |
        tools/bazel run --config=fast --defconfig_fragment=//common:user_flags.fragment //common:kernel_aarch64_dist -- --destdir=out

    - name: Package with AnyKernel3
      run: |
        ZIP_NAME="${{ inputs.kernel_name }}-${{ matrix.ksu }}"
        echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
        git clone --depth=1 --branch ${{ inputs.anykernel_branch }} https://github.com/Jayy-Dev/Hongshan-AnyKernel anykernel
        cp out/Image anykernel/Image
        cd anykernel
        zip -r9 "../${ZIP_NAME}.zip" . --exclude="*.git*" --exclude="README.md" --exclude="*.placeholder"

    - name: Upload flashable zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.ZIP_NAME }}.zip
        archive: false
